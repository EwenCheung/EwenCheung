<svg width="1100" height="190" viewBox="0 0 1100 190" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Animated experience timeline</title>
  <desc id="desc">A light animated timeline showing V-Key, NEA, GIC and incoming TikTok experience across production AI, research, finance and data infrastructure.</desc>
  <style>
    .title { font: 800 18px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #1E1B4B; letter-spacing: .08em; }
    .company { font: 800 16px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #111827; }
    .role { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #5B21B6; }
    .date { font: 700 11px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; fill: #1D4ED8; letter-spacing: .08em; }
    .card { fill: #FFFFFF; stroke: #C4B5FD; stroke-width: 1; filter: url(#glow); }
    .rail { stroke: #C7D2FE; stroke-width: 3; opacity: .6; }
    .flow { stroke: url(#grad); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 120 620; animation: run 4.8s linear infinite; filter: url(#lineGlow); }
    .dot { fill: #8B5CF6; animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
    .d2 { animation-delay: .55s; }
    .d3 { animation-delay: 1.1s; }
    .d4 { animation-delay: 1.65s; }
    .next { fill: #FFFFFF; stroke: #7C3AED; stroke-width: 1.5; stroke-dasharray: 6 4; filter: url(#glow); }
    .sweep { animation: sweep 6.2s ease-in-out infinite; }
    @keyframes run { to { stroke-dashoffset: -740; } }
    @keyframes pulse {
      0%, 100% { opacity: .72; r: 6; }
      50% { opacity: 1; r: 9; }
    }
    @keyframes sweep {
      0%, 100% { transform: translateX(-160px); opacity: 0; }
      20%, 75% { opacity: .55; }
      55% { transform: translateX(980px); opacity: .2; }
    }
    @media (prefers-reduced-motion: reduce) {
      .flow, .dot, .sweep { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1100" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset=".55" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#F8FAFC"/>
    </linearGradient>
    <linearGradient id="grad" x1="100" y1="92" x2="1000" y2="92" gradientUnits="userSpaceOnUse">
      <stop stop-color="#60A5FA"/>
      <stop offset=".42" stop-color="#8B5CF6"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#6D28D9" flood-opacity=".24"/>
    </filter>
    <filter id="lineGlow" x="-10%" y="-300%" width="120%" height="700%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#8B5CF6" flood-opacity=".8"/>
    </filter>
  </defs>
  <rect width="1100" height="190" rx="18" fill="url(#bg)"/>
  <rect class="sweep" x="0" y="0" width="160" height="190" fill="url(#grad)" opacity=".11"/>
  <text x="48" y="42" class="title">EXPERIENCE TRAJECTORY</text>
  <text x="48" y="64" class="role">Production AI -> ML research -> finance intelligence -> data infrastructure at scale</text>

  <path class="rail" d="M160 102 H940"/>
  <path class="flow" d="M160 102 H940"/>

  <g>
    <circle class="dot" cx="160" cy="102" r="7"/>
    <rect class="card" x="45" y="118" width="230" height="50" rx="12"/>
    <text x="160" y="139" text-anchor="middle" class="company">V-Key</text>
    <text x="160" y="157" text-anchor="middle" class="role">Production RAG + Text-to-SQL</text>
    <text x="160" y="91" text-anchor="middle" class="date">MAY 2025 - DEC 2025</text>
  </g>
  <g>
    <circle class="dot d2" cx="420" cy="102" r="7"/>
    <rect class="card" x="305" y="118" width="230" height="50" rx="12"/>
    <text x="420" y="139" text-anchor="middle" class="company">NEA / CCRS</text>
    <text x="420" y="157" text-anchor="middle" class="role">AI Weather Forecasting</text>
    <text x="420" y="91" text-anchor="middle" class="date">MAY 2026 - JUN 2026</text>
  </g>
  <g>
    <circle class="dot d3" cx="680" cy="102" r="7"/>
    <rect class="card" x="565" y="118" width="230" height="50" rx="12"/>
    <text x="680" y="139" text-anchor="middle" class="company">GIC</text>
    <text x="680" y="157" text-anchor="middle" class="role">Private Equity AI + Quant</text>
    <text x="680" y="91" text-anchor="middle" class="date">JUN 2026 - DEC 2026</text>
  </g>
  <g>
    <circle class="dot d4" cx="940" cy="102" r="7"/>
    <rect class="next" x="825" y="118" width="230" height="50" rx="12"/>
    <text x="940" y="139" text-anchor="middle" class="company">TikTok</text>
    <text x="940" y="157" text-anchor="middle" class="role">Data Warehouse Engineering</text>
    <text x="940" y="91" text-anchor="middle" class="date">INCOMING · JAN 2027</text>
  </g>
</svg>
